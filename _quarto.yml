project:
  type: website
  output-dir: _site

website:
  title: "Tu Nombre"
  navbar:
    pinned: true
    right:
      - text: "Español"
        href: index.qmd
      - text: "English"
        href: en/index.qmd
  # Un sidebar por idioma. Quarto muestra automáticamente el que
  # corresponde según la página que se esté viendo.
  sidebar:
    - id: es
      title: "Tu Nombre"
      style: "docked"
      contents:
        - text: "Inicio"
          href: index.qmd
        - text: "Información profesional"
          href: profesional.qmd
    - id: en
      title: "Your Name"
      style: "docked"
      contents:
        - text: "Home"
          href: en/index.qmd
        - text: "Professional information"
          href: en/professional.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    page-layout: full
