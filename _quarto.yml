# ── Configuración base = versión en ESPAÑOL (perfil por defecto) ──
project:
  type: website
  output-dir: _site
  # Este perfil solo renderiza las páginas en español (raíz).
  render:
    - index.qmd
    - profesional.qmd

website:
  title: "Tu Nombre"
  navbar:
    # Pestañas (páginas) en la barra de navegación
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Información profesional"
        href: profesional.qmd
    # Ícono con menú desplegable para elegir idioma
    right:
      - icon: translate
        menu:
          - text: "Español"
            href: index.qmd
          - text: "English"
            href: en/index.html

lang: es

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    page-layout: full
